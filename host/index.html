<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case Review</title>
    <!--
      Production host page for embedding in a SharePoint Content Editor Web Part.

      Asset URLs use the {{CORA_BASE}} token, which scripts/deploy_to_sharepoint.py
      substitutes at upload time with the server-relative base of the deploy
      target, e.g. /sites/<site>/Style Library/CODE/CORA.

      Why the paths are absolute: a Content Editor resolves relative URLs against
      the hosting .aspx page, not against this file's location in the Style
      Library, so relative hrefs 404. cora-styles.css's own relative @import of
      cora-design-tokens.css is fine — it resolves against the stylesheet's
      deployed URL, not the page.

      Full-viewport breakout (hiding the surrounding SharePoint chrome) is tracked
      separately in #268; this page only wires the assets.

      For local development use dev/index.html (relative paths, ?mock=1).
    -->
    <link rel="stylesheet" href="{{CORA_BASE}}/src/styles/cora-styles.css" />
    <link
      rel="stylesheet"
      href="{{CORA_BASE}}/src/pages/question-bank/cora-question-bank-editor.css"
    />
  </head>
  <body>
    <div id="app" data-cora-root></div>
    <!--
      {{CORA_ENV}} is substituted at deploy time ('prod' or 'uat') — the
      deployed host page is what declares its environment (ADR-0033). The app
      reads window.CORA_ENV via src/config/environment.js; anything other than
      'uat' (including an unsubstituted token) resolves to prod.
    -->
    <script>
      window.CORA_ENV = '{{CORA_ENV}}';
    </script>
    <script type="module" src="{{CORA_BASE}}/src/app.js"></script>
  </body>
</html>
