<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Review — Dev Harness</title>
  <link rel="stylesheet" href="../src/styles/cr-styles.css">
  <link rel="stylesheet" href="../src/question-bank/cr-question-bank-editor.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Dev-harness reset — production SharePoint provides its own body styles */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { background: #F3F3F4; }
    #app { min-height: 100%; }
  </style>
</head>
<body>
  <!--
    Dev harness for the Case Review Framework.
    Add ?mock=1 to use MockSharePointClient seeded from dev/fixtures/.
    Add ?asUser=reviewer (default) or ?asUser=owner to switch personas.

    Serve this directory with any static file server — e.g.:
      npx serve .
    Then open: http://localhost:3000/dev/?mock=1
  -->
  <div id="app" data-cr-root></div>
  <script type="module" src="../src/app.js"></script>
</body>
</html>
