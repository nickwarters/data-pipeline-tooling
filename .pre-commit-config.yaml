# Pre-commit hooks. Activate once per clone with `pre-commit install`
# (after `pip install -r requirements-dev.txt`). Hooks run on staged files at
# commit time; run across the whole tree with `pre-commit run --all-files`.
#
# ruff config (rules, line length, target version) is read from pyproject.toml,
# so the hooks behave identically to a local `ruff` invocation. The pinned `rev`
# tracks the ruff version in requirements-dev.txt; bump both together.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      # Lint with autofix first (includes import sorting), then format.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Run the test suite on commit. `language: system` uses the active environment
  # (activate the venv, or `pip install -r requirements-dev.txt`) so pytest and
  # its deps resolve cross-platform; `python -m pytest` avoids a hardcoded
  # `.venv/bin` path that would differ on Windows. The whole suite runs once
  # (pass_filenames: false) whenever a root-project Python file is staged;
  # the frontend and Forwarder suites are scoped separately below.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: system
        types: [python]
        exclude: ^(platform_frontend|forwarder)/
        pass_filenames: false

      - id: pytest-forwarder
        name: pytest (forwarder)
        entry: python -m pytest forwarder/tests -q
        language: system
        files: ^forwarder/.+\.py$
        pass_filenames: false

      # The canonical my-stats fixture is shared by the pipeline and frontend,
      # so changing it runs the pipeline-side contract test without broadening
      # root pytest.
      - id: pytest-my-stats-fixture
        name: pytest (my-stats fixture contract)
        entry: python -m pytest tests/integration/test_my_stats_fixture.py -q
        language: system
        files: ^platform_frontend/dev/fixtures/my-stats/.+\.txt$
        pass_filenames: false

  # The frontend framework under platform_frontend/ is a separate project with
  # its own toolchain. It enforced these checks through .husky/pre-commit ->
  # lint-staged, which stopped firing the moment it was nested: git reads hooks
  # only from the repository root. They run from here instead, so the projects
  # share one commit gate.
  #
  # `language: system` runs the binaries from platform_frontend/node_modules,
  # keeping its package.json the single source of truth for their versions.
  # Run `npm ci --prefix platform_frontend` once per clone, alongside
  # `pre-commit install` and the venv. `npm --prefix ... exec` resolves the same
  # way on Windows and macOS; a bare node_modules/.bin path would not.
  - repo: local
    hooks:
      # Mirrors lint-staged: eslint --fix then prettier --write over JS/TS, and
      # prettier alone over JSON/CSS/Markdown and the two explicitly JSON .txt
      # artifact directories (.prettierrc gives those the json parser).
      - id: eslint-frontend
        name: eslint (platform_frontend)
        entry: npm --prefix platform_frontend exec -- eslint --fix
        language: system
        files: ^platform_frontend/.+\.(js|ts)$

      - id: prettier-frontend
        name: prettier (platform_frontend)
        entry: npm --prefix platform_frontend exec -- prettier --write
        language: system
        files: ^platform_frontend/(.+\.(js|ts|json|css|md)|case-types/banks/.+\.txt|dev/fixtures/my-stats/.+\.txt)$

      # Beyond what lint-staged did, these mirror this repo's own convention that
      # a commit runs the tests for what it touches. pytest covers the whole
      # frontend Python suite; its `npm run test:deploy` discovers only
      # test_deploy*.py and would miss the scaffold tests entirely.
      - id: pytest-frontend
        name: pytest (platform_frontend)
        entry: python -m pytest platform_frontend/tests -q
        language: system
        files: ^platform_frontend/.+\.py$
        pass_filenames: false

      - id: node-test-frontend
        name: node --test (platform_frontend)
        entry: npm --prefix platform_frontend test
        language: system
        files: ^platform_frontend/(.+\.(js|ts)|dev/fixtures/my-stats/.+\.txt)$
        pass_filenames: false
